name: Build PredictiveBuffer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - Android64
          - Android32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          platform: ${{ matrix.platform }}
          combine: true
          android-min-sdk: 23

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: build/
